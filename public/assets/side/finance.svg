<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Finance app">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.52" stop-color="#D97706"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- three bars that rise -->
  <rect x="124" y="268" width="68" height="120" rx="18" fill="#FFFFFF" opacity="0.6"/>
  <rect x="222" y="200" width="68" height="188" rx="18" fill="#FFFFFF" opacity="0.8"/>
  <rect x="320" y="124" width="68" height="264" rx="18" fill="#FFFFFF"/>
</svg>
