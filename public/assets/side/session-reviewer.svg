<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="session_reviewer">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- stack of reviewed sessions -->
  <rect x="150" y="120" width="180" height="130" rx="20" fill="#FFFFFF" opacity="0.35"/>
  <rect x="128" y="150" width="180" height="130" rx="20" fill="#FFFFFF" opacity="0.6"/>
  <rect x="106" y="180" width="180" height="130" rx="20" fill="#FFFFFF"/>

  <!-- review lens over the freshest session -->
  <g stroke="#FFFFFF" stroke-width="26" fill="none" stroke-linecap="round">
    <circle cx="332" cy="318" r="60"/>
    <line x1="376" y1="362" x2="418" y2="404"/>
  </g>
</svg>
