<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Home server">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#059669"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- two units of a server, each with a status light -->
  <rect x="116" y="136" width="280" height="104" rx="26" fill="#FFFFFF"/>
  <rect x="116" y="272" width="280" height="104" rx="26" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="170" cy="188" r="18" fill="#059669"/>
  <circle cx="170" cy="324" r="18" fill="#059669"/>
</svg>
